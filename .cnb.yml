# ============================================
# CNB 云原生构建配置
# ============================================

# 主分支推送 - 同步到 GitHub
main:
  push:
    - runner:
        tags: cnb:arch:amd64
        cpus: 1
      imports: https://cnb.cool/dmxapi/claude-code-my/-/blob/main/env.yml
      stages:
        - name: sync to github with rebase
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/YeSongYun/OpenCode-DMXAPI.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            sync_mode: rebase

# Tag 推送 - 自动发布 Release
$:
  tag_push:
    - runner:
        tags: cnb:arch:amd64
        cpus: 1
      imports: https://cnb.cool/dmxapi/claude-code-my/-/blob/main/env.yml
      stages:
        # 0. 先同步 Tag 到 GitHub
        - name: sync tag to github
          image: alpine/git
          script:
            - git remote add github https://${GIT_USERNAME}:${GIT_ACCESS_TOKEN}@github.com/YeSongYun/OpenCode-DMXAPI.git || true
            - git push github ${CNB_BRANCH} --force

        # 1. 生成更新日志（使用 git-cliff 支持 commit 自动分类）
        - name: 生成更新日志
          image: cnbcool/default-build-env
          script:
            - curl -sSL https://github.com/orhun/git-cliff/releases/download/v2.7.0/git-cliff-2.7.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
            - git fetch --tags origin
            - ./git-cliff-2.7.0/git-cliff --config cliff.toml --latest --strip header
          exports:
            stdout: RELEASE_NOTES

        # 2. AI 润色更新日志（调用 dmxapi Anthropic 格式接口）
        - name: AI 润色更新日志
          image: cnbcool/default-build-env
          script:
            - |
              # 当前构建日期（兜底用，原始日志中已有日期时优先使用原始日期）
              TODAY=$(date +%Y-%m-%d)

              # 将 prompt 模板写入临时文件（避免 shell 特殊字符问题）
              cat > /tmp/ai_prompt.txt << PROMPT_EOF
              你是一个软件更新日志编辑器。请将以下 git 变更日志改写为面向普通用户的中文更新说明。

              要求：
              1. 严格保留原始变更日志中出现的版本号和日期，禁止修改、推断或编造任何日期
              2. 如果原始日志中没有日期，使用今天的日期：${TODAY}
              3. 用通俗易懂的语言描述每个变更，去掉技术术语
              4. 保留 emoji 分类图标
              5. 每条说明控制在一行以内
              6. 输出必须以 "## " 开头（Markdown 二级标题）
              7. 只输出改写后的更新日志，不要输出其他内容

              原始变更日志：
              PROMPT_EOF
              printf '%s' "${RELEASE_NOTES}" >> /tmp/ai_prompt.txt
              PROMPT=$(cat /tmp/ai_prompt.txt)

              call_ai() {
                curl -s -w "\n%{http_code}" "${AI_API_URL}/v1/messages" \
                  -H "Content-Type: application/json" \
                  -H "x-api-key: ${AI_API_KEY}" \
                  -H "anthropic-version: 2023-06-01" \
                  -d "$(jq -n \
                    --arg model "${AI_MODEL}" \
                    --arg prompt "${PROMPT}" \
                    '{model: $model, max_tokens: 4096, messages: [{role: "user", content: $prompt}]}')"
              }

              RESPONSE=$(call_ai)
              HTTP_CODE=$(echo "$RESPONSE" | tail -1)
              BODY=$(echo "$RESPONSE" | sed '$d')

              # 重试逻辑
              if [ "$HTTP_CODE" != "200" ]; then
                echo "AI API 首次调用失败 (HTTP $HTTP_CODE)，3 秒后重试..." >&2
                sleep 3
                RESPONSE=$(call_ai)
                HTTP_CODE=$(echo "$RESPONSE" | tail -1)
                BODY=$(echo "$RESPONSE" | sed '$d')
              fi

              # 提取 AI 输出并校验格式
              if [ "$HTTP_CODE" = "200" ]; then
                AI_TEXT=$(echo "$BODY" | jq -r '.content[0].text // empty')
                AI_LEN=${#AI_TEXT}
                if echo "$AI_TEXT" | head -1 | grep -q '^## ' && [ "$AI_LEN" -le 10000 ]; then
                  echo "$AI_TEXT"
                  exit 0
                fi
                echo "AI 输出格式验证失败（长度=${AI_LEN}），使用原始日志" >&2
              else
                echo "AI API 调用失败 (HTTP $HTTP_CODE)，使用原始日志" >&2
              fi

              # 回退：输出原始 RELEASE_NOTES
              echo "${RELEASE_NOTES}"
          exports:
            stdout: AI_RELEASE_NOTES

        # 3. 更新 CHANGELOG.md 并推送回 main
        - name: 更新 CHANGELOG.md
          image: cnbcool/default-build-env
          script:
            - |
              if [ -z "${AI_RELEASE_NOTES}" ]; then
                echo "AI_RELEASE_NOTES 为空，跳过 CHANGELOG 更新" >&2
                exit 0
              fi

              git config user.name "CNB Bot"
              git config user.email "bot@cnb.cool"

              # 基于 origin/main 创建临时分支（避免 detached HEAD）
              git fetch origin main
              git checkout -b temp-changelog origin/main

              # 找到第一个 "## " 标题的行号
              FIRST_HEADING=$(grep -n '^## ' CHANGELOG.md | head -1 | cut -d: -f1)

              if [ -n "$FIRST_HEADING" ]; then
                head -n $((FIRST_HEADING - 1)) CHANGELOG.md > /tmp/changelog_header.md
                tail -n +${FIRST_HEADING} CHANGELOG.md > /tmp/changelog_body.md

                cat /tmp/changelog_header.md > CHANGELOG.md
                echo "" >> CHANGELOG.md
                echo "${AI_RELEASE_NOTES}" >> CHANGELOG.md
                echo "" >> CHANGELOG.md
                cat /tmp/changelog_body.md >> CHANGELOG.md
              else
                echo "" >> CHANGELOG.md
                echo "${AI_RELEASE_NOTES}" >> CHANGELOG.md
              fi

              git add CHANGELOG.md
              git commit -m "docs: update CHANGELOG.md for ${CNB_BRANCH}"
              # 使用 CNB_TOKEN 推回 cnb.cool（tag_push 事件下具备代码读写权限）
              ORIGIN_URL=$(git remote get-url origin)
              ORIGIN_WITH_CREDS=$(echo "$ORIGIN_URL" | sed "s|https://[^@]*@|https://|; s|https://|https://cnb:${CNB_TOKEN}@|")
              git remote set-url origin "$ORIGIN_WITH_CREDS"
              if ! git push origin temp-changelog:main; then
                echo "推送 CHANGELOG.md 到 main 失败（可能存在并发冲突），跳过本次更新" >&2
                exit 0
              fi

        # 4. 编译各平台二进制文件
        - name: 编译 Windows AMD64
          image: golang:latest
          script:
            - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o opencode-dmxapi-${CNB_BRANCH}-windows-amd64.exe

        - name: 编译 Linux AMD64
          image: golang:latest
          script:
            - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o opencode-dmxapi-${CNB_BRANCH}-linux-amd64

        - name: 编译 Linux ARM64
          image: golang:latest
          script:
            - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o opencode-dmxapi-${CNB_BRANCH}-linux-arm64

        - name: 编译 macOS AMD64
          image: golang:latest
          script:
            - CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o opencode-dmxapi-${CNB_BRANCH}-macos-amd64

        - name: 编译 macOS ARM64
          image: golang:latest
          script:
            - CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o opencode-dmxapi-${CNB_BRANCH}-macos-arm64

        # 5. 先创建 Release（必须在上传附件之前）
        - name: 创建 Release
          type: git:release
          options:
            title: OpenCode DMXAPI ${CNB_BRANCH}
            description: |
              ## OpenCode DMXAPI 配置工具 ${CNB_BRANCH}

              一键配置 OpenCode 使用 DMXAPI 服务的跨平台工具。

              ---

              ${AI_RELEASE_NOTES}

              ---

              ### 📥 下载

              | 平台 | 架构 | 文件 |
              |------|------|------|
              | Windows | x64 | `opencode-dmxapi-${CNB_BRANCH}-windows-amd64.exe` |
              | Linux | x64 | `opencode-dmxapi-${CNB_BRANCH}-linux-amd64` |
              | Linux | ARM64 | `opencode-dmxapi-${CNB_BRANCH}-linux-arm64` |
              | macOS | Intel | `opencode-dmxapi-${CNB_BRANCH}-macos-amd64` |
              | macOS | Apple Silicon | `opencode-dmxapi-${CNB_BRANCH}-macos-arm64` |

              ---

              ### 🛠️ 安装说明

              #### Windows
              ```powershell
              # 下载后直接运行
              .\opencode-dmxapi-${CNB_BRANCH}-windows-amd64.exe
              ```

              #### Linux (x64)
              ```bash
              chmod +x opencode-dmxapi-${CNB_BRANCH}-linux-amd64
              ./opencode-dmxapi-${CNB_BRANCH}-linux-amd64
              ```

              #### Linux (ARM64)
              ```bash
              chmod +x opencode-dmxapi-${CNB_BRANCH}-linux-arm64
              ./opencode-dmxapi-${CNB_BRANCH}-linux-arm64
              ```

              #### macOS (Intel)
              ```bash
              chmod +x opencode-dmxapi-${CNB_BRANCH}-macos-amd64
              # 移除隔离属性（首次运行需要）
              xattr -dr com.apple.quarantine opencode-dmxapi-${CNB_BRANCH}-macos-amd64
              ./opencode-dmxapi-${CNB_BRANCH}-macos-amd64
              ```

              #### macOS (Apple Silicon)
              ```bash
              chmod +x opencode-dmxapi-${CNB_BRANCH}-macos-arm64
              # 移除隔离属性（首次运行需要）
              xattr -dr com.apple.quarantine opencode-dmxapi-${CNB_BRANCH}-macos-arm64
              ./opencode-dmxapi-${CNB_BRANCH}-macos-arm64
              ```

              ---

              ### 🔗 相关链接

              - [获取 API Token](https://www.dmxapi.cn/token)
              - [使用文档](https://cnb.cool/dmxapi/opencode_dmxapi)

        # 6. 再上传附件到已创建的 Release
        - name: 上传 Release 附件
          image: cnbcool/attachments
          settings:
            attachments:
              - "./opencode-dmxapi-${CNB_BRANCH}-*"
            ttl: 0

        # 7. 清理旧版本，只保留最近3个
        - name: 清理旧版本
          image: docker.cnb.cool/cnb/plugins/cnbcool/release-clean:latest
          settings:
            filter: "RECENT_N=3"
            debug: false